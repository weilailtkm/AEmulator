name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-36" "build-tools;36.0.0"

      - name: Build guest64 engine (API 37)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          chmod +x native/guest64/build.sh
          sh native/guest64/build.sh 37
          ls -la app/src/main/jniLibs/arm64-v8a/ | head

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aemulator-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
